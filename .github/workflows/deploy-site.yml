name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/site/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/site ci
      - run: npm run typecheck:site
      - run: npm run deploy:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
